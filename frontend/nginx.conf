server {
  listen       80;
  server_name  localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Vite's content-hashed JS/CSS chunks are safe to cache forever -- a rebuild
  # always produces a new filename, so there's nothing to invalidate.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html (and its SPA-fallback hits) must never be cached: it's the one
  # file whose content tells the browser which hashed chunk filenames to load.
  # Without this, a browser can keep an old index.html past a redeploy and
  # start requesting chunk files that no longer exist on the server, which
  # surfaces to users as "Failed to fetch dynamically imported module" /
  # a blank "Something went wrong" screen until they hard-refresh.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Optional: pass API requests to local host (not used inside container in prod)
  location /v1/ {
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain application/javascript text/css application/json;
}
