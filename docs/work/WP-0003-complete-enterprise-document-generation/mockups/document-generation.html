<script>
(()=>{
 const root=document.getElementById('lp-document-preview'), panel=root.querySelector('#lp-doc-content'), nav=root.querySelector('.lp-nav'), dialog=root.querySelector('dialog'), announcement=root.querySelector('[role=status]');
 const views=[['policy','Policy documents','files'],['templates','Template versions','file-check-2'],['operations','Operations','activity'],['exports','Excel exports','sheet'],['customer','Customer view','user-round']];
 const saved=window.openai?.widgetState?.privateContent;
 const state={view:views.some(v=>v[0]===saved?.view)?saved.view:'templates',policyScreen:'transaction',transactionId:'tx-issue-4',wizardStep:8,formsTab:'Documents',formOpened:false,edition:'1.4',selected:'packet',templateTab:'Definition',role:'Content reviewer',approved:false,activated:false,opFilter:'All',opSearch:'',opPriority:'All',opFormat:'All',exportCreated:false,exportReady:false,density:'comfortable'};
 const docs=[{id:'packet',name:'Homeowners policy packet',transaction:'Issue · Oct 18, 2026',edition:'2026-01',status:'Ready',integrity:'Verified',output:'PDF · 28 pages',version:'4',request:'DOC-004812'}, {id:'endorsement',name:'Coverage endorsement',transaction:'Endorsement · Nov 01, 2026',edition:'2026-02',status:'Processing',integrity:'Pending',output:'3 of 4 forms complete',version:'5',request:'DOC-004839'}, {id:'mortgagee',name:'Mortgagee evidence',transaction:'Evidence · Oct 18, 2026',edition:'2026-01',status:'Failed',integrity:'Not published',output:'Required PDF failed',version:'4',request:'DOC-004821'}, {id:'prior',name:'Prior policy packet',transaction:'Issue · Sep 18, 2026',edition:'2025-09',status:'Superseded',integrity:'Verified',output:'PDF · 26 pages',version:'3',request:'DOC-004530'}];
 const ops=[{id:'DOC-004839',ref:'HO-2026-001842',age:'42 sec / 10 min',stage:'Packet assembly',attempt:'1 / 5',status:'Processing',priority:'Urgent',format:'PDF'}, {id:'DOC-004821',ref:'HO-2026-001842',age:'8 min / 10 min',stage:'Office conversion',attempt:'2 / 5',status:'Failed',priority:'Urgent',format:'PDF'}, {id:'EXP-001205',ref:'Risk schedule',age:'3 min / 30 min',stage:'XLSX rendering',attempt:'1 / 5',status:'Pending',priority:'Bulk',format:'XLSX'}, {id:'DOC-004720',ref:'HO-2026-001753',age:'Archive restore',stage:'Archive unavailable',attempt:'1 / 5',status:'Unavailable',priority:'Standard',format:'PDF'}];
 const transactions=[{id:'tx-issue-4',number:'TX-0001842-04',type:'Issue',version:'4',versionId:'pv-4',effective:'Oct 18, 2026',status:'Issued',readOnly:true},{id:'tx-endorse-5',number:'TX-0001842-05',type:'Endorsement',version:'5',versionId:'pv-5',effective:'Nov 01, 2026',status:'In progress',readOnly:false},{id:'tx-issue-3',number:'TX-0001842-03',type:'Issue',version:'3',versionId:'pv-3',effective:'Sep 18, 2026',status:'Superseded',readOnly:true}];
 docs.forEach(doc=>{const tx=transactions.find(t=>t.version===doc.version);doc.transactionId=tx.id;doc.transactionNumber=tx.number;doc.versionId=tx.versionId;});
 const currentTransaction=()=>transactions.find(t=>t.id===state.transactionId);
 const masterForms=[
  {id:'declarations',key:'HO-DEC',name:'Homeowners declarations',edition:'2026-02',product:'Homeowners',states:['CA'],mode:'Policy data',format:'Word',file:'ho-declarations-2026-02.docx',start:'2026-11-01',end:'',transactions:['Issue','Endorsement','Renewal'],stage:'Issue',attach:'Always',condition:'Water backup selected',placement:'Start',order:10,scope:'Policy',required:true,visibility:'Customer-safe',status:'Draft',templateChecked:true,mappings:['policy.number','insured.primary.name','policy.effectiveDate'],test:null},
  {id:'privacy',key:'HO-PRIV',name:'Privacy notice',edition:'2026-01',product:'Homeowners',states:['CA','TX'],mode:'Static file',format:'PDF',file:'privacy-notice-2026-01.pdf',start:'2026-01-01',end:'',transactions:['Issue','Renewal'],stage:'Issue',attach:'Always',condition:'Water backup selected',placement:'End',order:100,scope:'Policy',required:true,visibility:'Customer-safe',status:'Draft',templateChecked:true,mappings:[],test:null},
  {id:'water',key:'HO-WB',name:'Water backup endorsement',edition:'2026-02',product:'Homeowners',states:['CA'],mode:'Policy data',format:'Word',file:'water-backup-2026-02.docx',start:'2026-11-01',end:'',transactions:['Issue','Endorsement','Renewal'],stage:'Issue',attach:'When condition matches',condition:'Water backup selected',placement:'After coverages',order:40,scope:'Policy',required:true,visibility:'Customer-safe',status:'Draft',templateChecked:true,mappings:['policy.number','insured.primary.name','policy.effectiveDate'],test:null},
  {id:'schedule',key:'PA-SCHED',name:'Vehicle schedule',edition:'2026-01',product:'Personal Auto',states:['TX'],mode:'Policy data',format:'Excel',file:'vehicle-schedule.xlsx',start:'2026-01-01',end:'',transactions:['Issue','Renewal'],stage:'Issue',attach:'Always',condition:'Water backup selected',placement:'After coverages',order:30,scope:'Policy',required:true,visibility:'Internal only',status:'Active',templateChecked:true,mappings:['policy.number','insured.primary.name','policy.effectiveDate'],test:null}
 ];
 const admin={selected:'declarations',tab:'Details & scope',product:'All products',state:'All states',search:'',showHistory:false,error:'',scenario:{product:'Homeowners',state:'CA',transaction:'Endorsement',date:'2026-11-01',water:true}};
 const selectedMaster=()=>masterForms.find(f=>f.id===admin.selected);
 const adminTabs=['Details & scope','Template','Attachment','Test & publish'];
 let opSelected='DOC-004821',lastFocus;
 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const badge=s=>`<span class="lp-badge ${['Ready','Verified','Approved','Active','Passed','Reconciled'].includes(s)?'lp-ready':['Failed','Unavailable'].includes(s)?'lp-failed':['Processing','Pending','Review required'].includes(s)?'lp-pending':''}">${esc(s)}</span>`;
 // Views come from data-action attributes; only known views reach render().
 const VIEWS=['policy','templates','operations','exports','customer'];
 // Free text from inputs is escaped before it is stored, because render() builds markup with innerHTML.
 const clean=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const button=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
 function save(){window.openai?.setWidgetState?.({modelContent:{screen:state.view,templateReview:state.approved?'approved in prototype':'pending'},privateContent:{view:state.view}})?.catch(()=>{});}
 function notify(text){announcement.hidden=false;announcement.className='lp-notice';announcement.textContent=text;}
 function icons(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
 function table(headers,rows){return `<div class="lp-scroll" tabindex="0" aria-label="Scrollable results"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
 function detail(d){return `<section class="lp-detail" aria-label="Selected document details"><div class="lp-heading"><h2>${esc(d.name)}</h2>${badge(d.status)}</div><dl class="lp-grid"><div><dt>Transaction #</dt><dd>${esc(d.transactionNumber)}</dd></div><div><dt>Request</dt><dd>${d.request}</dd></div><div><dt>Policy version</dt><dd>Version ${d.version} · pinned</dd></div><div><dt>Publication</dt><dd>${d.status==='Ready'?'All required outputs verified':'Not available for delivery'}</dd></div><div><dt>Classification</dt><dd>Customer-safe PDF</dd></div><div><dt>Template / engine</dt><dd>HO package 1.3 / 0.3.0</dd></div><div><dt>Archive</dt><dd>${d.status==='Ready'?'Immutable · SHA-256 verified':'Awaiting publication'}</dd></div></dl>${d.status==='Failed'?'<p class="lp-error">Required PDF conversion failed. No partial packet was published. Trace: conversion-4821.</p>':`<h3>Required forms · assembly order</h3><div class="lp-context"><span>1. HO-DEC · 2 pages</span><span>2. HO-3 · 22 pages</span><span>3. HO-118 · 3 pages</span><span>4. HO-MTG · 1 page</span></div>`}<div class="lp-actions">${button(icon('eye')+' Preview PDF','preview','',d.status!=='Ready'&&d.status!=='Superseded')}${button('Rendition lineage','lineage','lp-quiet')}</div></section>`;}

 function templateDetail(){if(state.templateTab==='Preview')return `<div class="lp-paper"><span class="lp-badge lp-pending">Draft · Not a policy contract</span><h2>Homeowners declarations</h2><div>Northstar Mutual</div><hr><dl class="lp-grid"><div><dt>Named insured</dt><dd>Maya Patel</dd></div><div><dt>Policy</dt><dd>HO-2026-001842</dd></div><div><dt>Edition</dt><dd>2026-02</dd></div></dl><p>Coverage A · Dwelling</p><strong>$450,000</strong></div>`;
 if(state.templateTab==='Validation')return table(['Evidence','Result','Fixture'],[['Required bindings','Passed','Synthetic household'],['PDF rendering / fonts','Passed','HO-DEC-2026-02'],['DOCX / PDF reconciliation','Passed','Four-page fixture'],['Long names / overflow','Passed','Maximum-length fixture']].map(r=>`<tr><td>${r[0]}</td><td>${badge(r[1])}</td><td>${r[2]}</td></tr>`));

   root.querySelector('.lp-record-context').innerHTML=area==='Policies'?`<div class="lp-breadcrumb">Policies / HO-2026-001842 / Transactions${state.policyScreen==='transaction'?' / '+tx.number:''}</div><div class="lp-heading"><h1 id="lp-record-title">${state.policyScreen==='transaction'?tx.type+' · '+tx.number:'HO-2026-001842'}</h1>${state.policyScreen==='transaction'?button(icon('arrow-left')+' Back to policy','back-policy'):badge('Issued')}</div><div class="lp-context"><span>Policy <strong>HO-2026-001842</strong></span><span><strong>Maya Patel</strong></span><span>Homeowners</span><span>Oct 18, 2026 - Oct 18, 2027</span></div>`:`<div class="lp-heading"><h1>${area}</h1></div>`;
   const tabs=area==='Policies'?[]:area==='Administration'?[{label:'Forms',action:'view:templates',selected:state.view==='templates'},{label:'Document operations',action:'view:operations',selected:state.view==='operations'}]:[{label:area==='Reporting'?'Risk schedule export':'Documents',action:'view:'+state.view,selected:true}];

     const history=panel.querySelector('.lp-edition-history');if(history)history.querySelector('.lp-breadcrumb').textContent='Administration / Forms / HO-DEC / Editions';

     const editionSummary=panel.querySelector('.lp-edition-history summary');if(editionSummary)editionSummary.textContent='Edition 2026-02 · Template revision 1.4 · '+(state.approved?'Content approved':'Awaiting content review');
     const approve=panel.querySelector('[data-action=approve]');if(approve&&selectedMaster().status!=='Review required')approve.disabled=true;

 function openDialog(title,body,action,label){lastFocus=document.activeElement;dialog.innerHTML=`<div class="lp-heading"><h2 id="lp-doc-dialog-title">${title}</h2>${button(icon('x'),'close','lp-icon')}</div>${body}<div class="lp-actions">${button('Cancel','close')}${action?button(label,action,'lp-primary'):''}</div>`;dialog.querySelector('[data-action=close]').setAttribute('aria-label','Close dialog');dialog.showModal();icons();}

 root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a.startsWith('view:')){const view=a.split(':')[1];if(!VIEWS.includes(view))return;state.view=view;announcement.hidden=true;render();nav.querySelector('[aria-selected=true]').focus();save();}
 else if(a.startsWith('area:')){const area=a.slice(5);state.view=({'Policies':'policy','Administration':'templates','Reporting':'exports','Customer portal':'customer'})[area];if(area==='Policies')state.policyScreen='transactions';if(area==='Administration')state.formOpened=false;announcement.hidden=true;render();save();}
 else if(a==='back-policy'){state.policyScreen='transactions';render();}

 else if(a.startsWith('master:')){admin.selected=a.slice(7);admin.tab='Details & scope';admin.error='';state.formOpened=true;state.edition='1.4';render();}
 else if(a.startsWith('admin-tab:')){admin.tab=a.slice(10);admin.error='';render();root.querySelector('[data-action="'+a+'"]')?.focus();}
 else if(a==='check-master-template'){const f=selectedMaster();if(f.uploadError||!f.file){admin.error=f.uploadError||'Choose a template file first.';}else if(f.mode==='Policy data'&&f.mappings.some(v=>!v)){admin.error='Map every required policy data field.';}else{admin.error='';f.templateChecked=true;notify('Sample template checks passed. Production parser and rendering checks are not run in this prototype.');}render();}
 else if(a==='test-master')testMaster();
 else if(a==='preview-master'){const f=selectedMaster();if(!f.test?.matches)return;openDialog('Document preview',`<div class="lp-paper"><span class="lp-badge">Synthetic preview · ${f.mode==='Static file'?'Static PDF':'Policy data'}</span><h2>${esc(f.name)}</h2><p>${esc(f.key)} · Edition ${esc(f.edition)}</p><hr>${f.mode==='Static file'?'<h3>Privacy notice</h3><p>Sample carrier wording. No policy fields are merged.</p>':'<p>Policy: HO-TEST-001</p><p>Named insured: Maya Patel</p><p>Transaction effective: '+esc(admin.scenario.date)+'</p>'}</div>`);}
 else if(a==='save-master'){notify('Draft saved locally in this prototype. No carrier configuration was published.');}
 else if(a==='continue-master'){const f=selectedMaster();if(admin.tab==='Details & scope'&&(!f.key||!f.name||!f.states.length||!f.start)){admin.error='Enter the form number, title, effective date and at least one state.';render();return;}if(admin.tab==='Template'&&(!f.file||!f.templateChecked||f.uploadError)){admin.error='Choose and check a supported template before continuing.';render();return;}if(admin.tab==='Attachment'&&!f.transactions.length){admin.error='Select at least one transaction type.';render();return;}admin.tab=adminTabs[Math.min(3,adminTabs.indexOf(admin.tab)+1)];admin.error='';render();}
 else if(a==='submit-master'){const f=selectedMaster();if(f.status!=='Draft'||!f.test?.matches||!f.templateChecked)return;f.status='Review required';admin.showHistory=true;render();notify('Submitted for independent review in this prototype. Production remains inactive.');}
 else if(a==='add-master')openDialog('Add form',`<div class="lp-fields"><label class="lp-field">Form number<input id="lp-new-key" required></label><label class="lp-field">Form title<input id="lp-new-name" required></label><label class="lp-field">Edition<input id="lp-new-edition" value="2026-03" required></label><label class="lp-field">Product<select id="lp-new-product"><option>Homeowners</option><option>Personal Auto</option><option>Commercial Property</option></select></label></div>`,'confirm-add-master','Create draft');
 else if(a==='confirm-add-master'){const key=dialog.querySelector('#lp-new-key'),name=dialog.querySelector('#lp-new-name'),edition=dialog.querySelector('#lp-new-edition');if(!key.reportValidity()||!name.reportValidity()||!edition.reportValidity())return;if(masterForms.some(f=>f.key===clean(key.value.trim())&&f.edition===clean(edition.value))){edition.setCustomValidity('This form edition already exists.');edition.reportValidity();return;}const next={...JSON.parse(JSON.stringify(masterForms[0])),id:'form-'+masterForms.length,key:clean(key.value.trim()),name:clean(name.value.trim()),edition:clean(edition.value.trim()),product:clean(dialog.querySelector('#lp-new-product').value),states:[],transactions:[],start:'',status:'Draft',file:'',templateChecked:false,test:null};masterForms.push(next);admin.selected=next.id;admin.tab='Details & scope';state.formOpened=true;closeDialog();render();}
 else if(a==='clone-master'){const f=selectedMaster();openDialog('Create new edition',`<p>${esc(f.key)} · Current edition ${esc(f.edition)}</p><label class="lp-field">New edition<input id="lp-next-edition" value="2026-03" required></label>`,'confirm-clone-master','Create draft');}
 else if(a==='confirm-clone-master'){const f=selectedMaster(),input=dialog.querySelector('#lp-next-edition');if(!input.reportValidity())return;if(masterForms.some(x=>x.key===f.key&&x.edition===clean(input.value))){input.setCustomValidity('Choose a different edition.');input.reportValidity();return;}const next={...JSON.parse(JSON.stringify(f)),id:'form-'+masterForms.length,edition:clean(input.value),status:'Draft',test:null};masterForms.push(next);admin.selected=next.id;admin.tab='Details & scope';state.approved=false;state.activated=false;closeDialog();render();}
 else if(a==='open-form'||a==='latest-edition'){state.formOpened=true;state.edition='1.4';render();}
 else if(a==='all-forms'){state.formOpened=false;render();}
 else if(a.startsWith('edition:')){state.edition=a.slice(8);render();}
 else if(a.startsWith('doc:')){state.selected=a.slice(4);render();panel.querySelector(`[data-action="${a}"]`)?.focus();}
 else if(a.startsWith('step:')){state.wizardStep=Number(a.slice(5));render();root.querySelector('[data-action="'+a+'"]')?.focus();}
 else if(a.startsWith('wizard-tab:')){state.formsTab=a.slice(11);render();root.querySelector('[data-action="'+a+'"]')?.focus();}
 else if(a.startsWith('template:')){state.templateTab=a.slice(9);render();panel.querySelector(`[data-action="${a}"]`).focus();}
 else if(a.startsWith('op:')){opSelected=a.slice(3);render();}
 else if(a==='close')closeDialog();
 else if(a==='generate'){const tx=currentTransaction();if(tx.readOnly)return;state.requestTransactionId=tx.id;openDialog('Generate documents',`<label class="lp-field">Document purpose<select id="lp-purpose"><option>${tx.type==='Endorsement'?'Endorsement package':'Policy packet'}</option><option>Evidence of insurance</option></select></label><div class="lp-context"><span>Policy <strong>HO-2026-001842</strong></span><span>Transaction <strong>${tx.number}</strong></span><span>Policy version <strong>${tx.version}</strong></span><span>Effective <strong>${tx.effective}</strong></span></div><label class="lp-check"><input type="checkbox" checked disabled>PDF · required</label><label class="lp-check"><input id="lp-native" type="checkbox">DOCX · internal editable rendition</label>`,'confirm-generate','Generate documents');}
 else if(a==='confirm-generate'){const tx=currentTransaction();if(tx.readOnly||tx.id!==state.requestTransactionId)return;const purpose=clean(dialog.querySelector('#lp-purpose').value);const native=dialog.querySelector('#lp-native').checked;const id='new'+docs.length;docs.push({id,name:purpose,transaction:tx.type+' · '+tx.effective,edition:tx.version==='5'?'2026-02':'2026-01',status:'Pending',integrity:'Pending',output:native?'PDF + internal DOCX requested':'PDF requested',version:tx.version,versionId:tx.versionId,transactionId:tx.id,transactionNumber:tx.number,request:'DOC-0048'+(40+docs.length)});state.selected=id;closeDialog();render();notify('Generation requested for '+tx.number+'. No documents have been issued or delivered.');}
 else if(a==='preview'){const d=state.view==='customer'?docs.find(d=>d.id==='packet'):visibleDocuments().find(d=>d.id===state.selected);if(!d||!['Ready','Superseded'].includes(d.status))return;openDialog('PDF preview',`<div class="lp-paper"><span class="lp-badge">Synthetic preview</span><h2>${esc(d.name)}</h2><p>Northstar Mutual</p><hr><p>Policy HO-2026-001842</p><p>Named insured: Maya Patel</p><p>Transaction ${esc(d.transactionNumber)}</p><p>Edition ${d.edition} · Policy version ${d.version}</p></div>`);}
 else if(a==='lineage')openDialog('Rendition lineage','<p>Version 3 / DOC-004530 → Version 4 / DOC-004812</p><p>Original archived bytes retained. Reprints do not rerender current templates.</p>');
 else if(a==='approve')openDialog('Approve content · version 1.4','<p>HO-DEC · sha256: 9f03…c41a</p><p>Casey Morgan · independent content reviewer</p><p>Approval does not activate the version.</p>','confirm-approve','Approve content');
 else if(a==='confirm-approve'){state.approved=true;selectedMaster().status='Approved';closeDialog();render();notify('Content approved in this prototype. Technical activation is still required.');save();}
 else if(a==='activate')openDialog('Activate version 1.4','<p>HO-DEC · sha256: 9f03…c41a</p><p>Target: Validation · Homeowners / CA / en-US</p><p>Effective: Nov 01, 2026 · Publisher: Taylor Kim</p>','confirm-activate','Activate in validation');
 else if(a==='confirm-activate'){state.activated=true;closeDialog();render();notify('Version 1.4 activated in the prototype validation environment only.');}
 else if(a==='refresh')notify('Synthetic request snapshot refreshed. No generation was started.');
 else if(a==='export')requestExport();
 else if(['retry','cancel-request','restore'].includes(a)){const title={retry:'Retry failed request', 'cancel-request':'Cancel request',restore:'Request archive restore'}[a];openDialog(title,`<p>${opSelected}</p><p>${a==='retry'?'Retry the failed request using its recorded inputs? A linked request will preserve the original audit.':a==='cancel-request'?'Cancel pending work? Already-issued copies will not be deleted.':'Request an integrity-checked restore? Published originals will not be overwritten.'}</p>`,'confirm-'+a,title);}
 else if(a==='confirm-retry'){const source=ops.find(o=>o.id===opSelected);ops.push({...source,id:'DOC-004850',age:'0 sec / 10 min',stage:'Queued retry',attempt:'0 / 5',status:'Pending'});opSelected='DOC-004850';closeDialog();render();notify('Retry requested as DOC-004850. Original failed request retained.');}
 else if(a==='confirm-cancel-request'){ops.find(o=>o.id===opSelected).status='Cancelled';closeDialog();render();notify('Request cancelled in prototype. Existing issued copies were not deleted.');}
 else if(a==='confirm-restore'){closeDialog();notify('Archive restore requested for review. Original publication remains unavailable.');}
 else if(a.startsWith('sheet:'))openDialog('Risk schedule · XLSX preview',`<p class="lp-small lp-muted">Synthetic sample · Part ${a.slice(6)} · As of ${esc(state.exportDate)}</p>${table(['Policy identifier','Locations','Insured value'],['<tr><td>00123</td><td>2</td><td>$450,000</td></tr>','<tr><td>00481</td><td>1</td><td>$325,000</td></tr>'])}<p class="lp-small">Identifier cells: text · Locations and insured values: numeric</p>`);
 });
 root.addEventListener('change',e=>{
   const input=e.target,f=selectedMaster();
   if(input.dataset.adminFilter){admin[input.dataset.adminFilter]=clean(input.value);render();return;}
   if(input.dataset.scenario){admin.scenario[input.dataset.scenario]=input.type==='checkbox'?input.checked:clean(input.value);f.test=null;render();return;}
   if(input.dataset.master||input.dataset.masterCheck||input.dataset.mapping!==undefined||input.id==='lp-master-file'){
     if(f.status!=='Draft')return;
     f.test=null;admin.error='';if(f.id==='declarations'){state.approved=false;state.activated=false;}
     if(input.dataset.master){const key=input.dataset.master;f[key]=input.type==='number'?Number(input.value):clean(input.value);if(key==='mode'||key==='format'){f.file='';f.templateChecked=false;f.uploadError='';if(key==='mode'){f.format=f.mode==='Static file'?'PDF':'Word';f.mappings=f.mode==='Static file'?[]:['policy.number','insured.primary.name','policy.effectiveDate'];}}}
     if(input.dataset.masterCheck){const key=input.dataset.masterCheck;if(['states','transactions'].includes(key))f[key]=input.checked?[...new Set([...f[key],clean(input.value)])]:f[key].filter(v=>v!==clean(input.value));else f[key]=input.checked;}
     if(input.dataset.mapping!==undefined){f.mappings[Number(input.dataset.mapping)]=clean(input.value);f.templateChecked=false;}
     if(input.id==='lp-master-file'){const file=input.files?.[0];if(file){const ext=f.mode==='Static file'||f.format==='Fillable PDF'?'.pdf':f.format==='Word'?'.docx':'.xlsx';if(!file.name.toLowerCase().endsWith(ext)||file.size>16*1024*1024){f.uploadError='Choose a '+ext+' file no larger than 16 MB.';}else{f.file=clean(file.name);f.uploadError='';f.templateChecked=false;}}}
     render();return;
   }
   const mapping={'lp-doc-role':'role','lp-doc-status':'opFilter','lp-doc-priority':'opPriority','lp-doc-format':'opFormat'};if(mapping[input.id]){state[mapping[input.id]]=clean(input.value);render();root.querySelector('#'+input.id)?.focus();}
 });

 root.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab')return;const container=e.target.closest('[role=tablist]');if(!container)return;const tabs=[...container.querySelectorAll('[role=tab]')];const idx=tabs.indexOf(e.target);const next=e.key==='ArrowRight'?(idx+1)%tabs.length:e.key==='ArrowLeft'?(idx+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:-1;if(next>=0){e.preventDefault();const action=tabs[next].dataset.action;tabs[next].click();root.querySelector(`[data-action="${action}"]`)?.focus();}});

 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.dataset.density=state.density;}});tweak.addSelect(state,'density',{label:'Table density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
