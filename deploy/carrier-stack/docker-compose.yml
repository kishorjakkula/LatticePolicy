# One carrier, one stack: API, batch worker, message dispatcher, UI,
# PostgreSQL, Redis, and document storage.
# Driven by stack.sh with a per-carrier env file (see carrier.env.example).
# Uses published release images; nothing is built here.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lattice_policy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-lattice_policy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lattice_policy} -d ${DB_NAME:-lattice_policy}"]
      interval: 5s
      timeout: 5s
      retries: 12

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One release image, three start commands. The API serves requests; the
  # worker runs scheduled and queued batch jobs; the dispatcher delivers
  # outbox messages. Each can be scaled, restarted, or replaced on its own.
  api:
    image: &app-image ${LATTICE_API_IMAGE:-ghcr.io/kishorjakkula/latticepolicy-api}:${LATTICE_VERSION:?LATTICE_VERSION is required}
    restart: unless-stopped
    environment:
      <<: &app-environment
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
        DATABASE_URL: postgres://${DB_USER:-lattice_policy}:${DB_PASSWORD}@db:5432/${DB_NAME:-lattice_policy}
        CARRIER_TENANT_ID: ${CARRIER_TENANT_ID:?CARRIER_TENANT_ID is required}
        TENANT_RLS_ENFORCED: ${TENANT_RLS_ENFORCED:-1}
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
        CUSTOMER_DATA_KEY: ${CUSTOMER_DATA_KEY:?CUSTOMER_DATA_KEY is required}
        PII_LOOKUP_KEY: ${PII_LOOKUP_KEY:?PII_LOOKUP_KEY is required}
        MFA_TOKEN_SECRET: ${MFA_TOKEN_SECRET:?MFA_TOKEN_SECRET is required}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
        REDIS_URL: redis://cache:6379
        CACHE_ENABLED: "1"
        DOCUMENT_STORAGE_DIR: /data/documents
        # Set only when a carrier pack is mounted (CARRIER_PACK_PATH in the env file).
        CARRIER_PACK_DIR: ${CARRIER_PACK_PATH:+/carrier-pack}
        SENTRY_DSN: ${SENTRY_DSN:-}
        # Submission intake reader; the worker runs the reads. See docs/SUBMISSION_INTAKE.md.
        INTAKE_AI_PROVIDER: ${INTAKE_AI_PROVIDER:-builtin}
        INTAKE_AI_MODEL: ${INTAKE_AI_MODEL:-}
        INTAKE_AI_BASE_URL: ${INTAKE_AI_BASE_URL:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LATTICE_ROLE: api
      # Only read by `stack.sh bootstrap`.
      CARRIER_NAME: ${CARRIER_NAME:-}
      CARRIER_ADMIN_USERNAME: ${CARRIER_ADMIN_USERNAME:-}
      CARRIER_ADMIN_PASSWORD: ${CARRIER_ADMIN_PASSWORD:-}
    volumes: &app-volumes
      - documents:/data/documents
      - ${CARRIER_PACK_PATH:-./no-pack}:/carrier-pack:ro
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-3300}:3000"
    depends_on: &app-depends-on
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  worker:
    image: *app-image
    restart: unless-stopped
    command: ["node", "server/dist/worker.js"]
    environment:
      <<: *app-environment
    volumes: *app-volumes
    depends_on: *app-depends-on

  dispatcher:
    image: *app-image
    restart: unless-stopped
    command: ["node", "server/dist/dispatcher.js"]
    environment:
      <<: *app-environment
      # Where outbox messages are delivered: a webhook (default) or Kafka.
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-webhook}
      # Webhook. An empty URL writes messages to the dispatcher's log.
      ASYNC_PUSH_WEBHOOK_URL: ${ASYNC_PUSH_WEBHOOK_URL:-}
      ASYNC_PUSH_AUTH_HEADER: ${ASYNC_PUSH_AUTH_HEADER:-}
      # Kafka.
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-}
      KAFKA_SSL: ${KAFKA_SSL:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
    volumes: *app-volumes
    depends_on: *app-depends-on

  frontend:
    image: ${LATTICE_FRONTEND_IMAGE:-ghcr.io/kishorjakkula/latticepolicy-frontend}:${LATTICE_VERSION}
    restart: unless-stopped
    environment:
      LATTICE_API_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      LATTICE_CARRIER_TENANT_ID: ${CARRIER_TENANT_ID}
      LATTICE_USE_MOCK: "0"
      LATTICE_SHOW_DEMO_CREDENTIALS: "0"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${UI_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  documents:
