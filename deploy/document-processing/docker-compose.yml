# Separate carrier-owned inference stack. Preload images and model files before
# connecting carrier data; this network has no external routing or host ports.
services:
  document-processor:
    build:
      context: ../..
      dockerfile: services/document-processor/Dockerfile
    restart: unless-stopped
    environment:
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:?A private service token is required}
      MODEL_BASE_URL: http://model:11434/v1
      MODEL_NAME: ${MODEL_NAME:?An approved preloaded local model is required}
      MODEL_ARTIFACT_SHA256: ${MODEL_ARTIFACT_SHA256:?The approved model artifact digest is required}
      CARRIER_TENANT_ID: ${CARRIER_TENANT_ID:?The carrier tenant is required}
      RELEASE_ENVIRONMENT: ${RELEASE_ENVIRONMENT:-production}
      LLM_RELEASE_PUBLIC_KEY_FILE: /release-key/public.pem
      LLM_RELEASE_MAX_AGE_SECONDS: ${LLM_RELEASE_MAX_AGE_SECONDS:-604800}
      LLM_RELEASE_REVOCATION_FILE: ${LLM_RELEASE_REVOCATION_FILE:-/release-policy/revocations.json}
      PROFILES_DIR: /profiles
    volumes:
      - ${EXTRACTION_PROFILES_DIR:?An absolute reviewed profiles directory is required}:/profiles:ro
      - ${LLM_RELEASE_PUBLIC_KEY_FILE:?The trusted release public key is required}:/release-key/public.pem:ro
      # Required host LLM_RELEASE_REVOCATION_DIR must already exist. Mount the
      # directory so atomic replacement of LLM_RELEASE_REVOCATION_FILE is visible
      # per inference; that file variable is a container path under /release-policy.
      - type: bind
        source: ${LLM_RELEASE_REVOCATION_DIR:?An absolute carrier-owned revocation directory is required}
        target: /release-policy
        read_only: true
        bind:
          create_host_path: false
    networks: [processing]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    depends_on: [model]

  model:
    # Supply a pinned Ollama image/digest approved by the carrier. No model pull
    # or automatic training occurs here. Other engines can replace this service
    # if they expose /v1/chat/completions on the configured internal endpoint.
    image: ${OLLAMA_IMAGE:?Supply an approved pinned Ollama image or digest}
    restart: unless-stopped
    command: [serve]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODELS: /models
      OLLAMA_DEBUG: "false"
      OLLAMA_NOPRUNE: "true"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${LOCAL_MODELS_DIR:?An absolute pre-provisioned model directory is required}:/models:ro
    networks: [processing]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${MODEL_MEMORY_LIMIT:-8g}
    logging:
      driver: none

networks:
  processing:
    name: ${DOCUMENT_NETWORK:-lattice-documents-private}
    internal: true
