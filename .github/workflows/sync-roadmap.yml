name: Sync Roadmap Metadata

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print planned label/milestone changes without writing to GitHub"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels and milestones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Sync roadmap metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run sync:github-roadmap
