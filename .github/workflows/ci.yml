name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Test, Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check module boundaries
        run: npm run check:architecture

      - name: Delivery flow contracts, adapters and work packages
        run: npm run test:delivery && npm run agents:sync -- --check && npm run delivery:check

      - name: Test carrier deployment recovery ordering and pilot metrics
        run: node --test scripts/carrier-stack.test.mjs scripts/pilot-lib.test.mjs

      - name: Test shared packages
        run: npm run test:packages

      - name: Test private document processor
        run: npm run test:document-processor

      - name: Test release signer
        run: npm run test:release-signer

      - name: Test private document learning and offline trainer contracts
        run: npm run test:document-learning && npm run test:document-training && npm run test:document-deployment

      - name: Build independent learning operator image
        run: docker build -f services/document-learning/Dockerfile -t lattice-document-learning:ci .

      - name: Build private document processor image
        run: docker build -f services/document-processor/Dockerfile -t lattice-document-processor:ci .

      - name: Test offline OCR and signed release enforcement
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=128m,mode=1777 --memory 512m
          -e RUN_OCR_SMOKE=1 lattice-document-processor:ci
          node --test ocr.test.mjs release-authorization.test.mjs

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_USE_MOCK: "0"
        run: npm run build:frontend

      - name: Test frontend
        run: npm run test:frontend

      - name: Build server
        run: npm run build:server

      - name: Test server
        run: npm run test:server

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Typecheck
        run: npm run typecheck

  integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lattice_policy
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: lattice_policy_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice_policy -d lattice_policy_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run DB integration tests
        env:
          DATABASE_URL: postgres://lattice_policy:integration_password@127.0.0.1:5432/lattice_policy_integration
          LATTICE_DISPOSABLE_TEST_DATABASE: "true"
        run: npm run test:integration --workspace=server

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Isolated stack: own ports/volumes and TRUST_PROXY=1, so the full suite's
      # per-test client IPs keep it clear of the login and API rate limiters.
      - name: Run Docker E2E suite
        run: npm run test:e2e:isolated

      # Writes passed/failed counts and every failing test to the run summary.
      - name: Report Playwright results
        if: always()
        run: node scripts/summarize-playwright.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
