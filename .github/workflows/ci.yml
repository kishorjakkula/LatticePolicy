name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Test, Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_USE_MOCK: "0"
        run: npm run build:frontend

      - name: Test frontend
        run: npm run test:frontend

      - name: Build server
        run: npm run build:server

      - name: Test server
        run: npm run test:server

      - name: Typecheck
        run: npm run typecheck

  integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lattice_policy
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: lattice_policy_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice_policy -d lattice_policy_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run DB integration tests
        env:
          DATABASE_URL: postgres://lattice_policy:integration_password@127.0.0.1:5432/lattice_policy_integration
        run: npm run test:integration --workspace=server

  e2e:
    name: Playwright E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Docker E2E smoke
        run: npm run test:e2e:docker

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
