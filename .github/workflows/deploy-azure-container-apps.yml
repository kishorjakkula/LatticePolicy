name: Deploy To Azure Container Apps

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-test
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  AZURE_CONTAINER_APP_API: ${{ vars.AZURE_CONTAINER_APP_API }}
  AZURE_CONTAINER_APP_FRONTEND: ${{ vars.AZURE_CONTAINER_APP_FRONTEND }}
  AZURE_CONTAINER_APP_MIGRATION_JOB: ${{ vars.AZURE_CONTAINER_APP_MIGRATION_JOB }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  # Optional: set the CARRIER_TENANT_ID repository variable for a single-carrier stack.
  VITE_CARRIER_TENANT_ID: ${{ vars.CARRIER_TENANT_ID }}
  TEST_API_HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
  TEST_FRONTEND_URL: ${{ vars.TEST_FRONTEND_URL }}

jobs:
  e2e:
    name: Playwright E2E (pre-deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Full suite against a disposable stack built from the commit being deployed.
      - name: Run full Playwright suite
        run: npm run test:e2e:isolated

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    name: Build, Push, Deploy
    needs: e2e
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required variables
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_CONTAINER_REGISTRY
            AZURE_CONTAINER_APP_API
            AZURE_CONTAINER_APP_FRONTEND
            AZURE_CONTAINER_APP_MIGRATION_JOB
            VITE_API_BASE_URL
            TEST_API_HEALTH_URL
            TEST_FRONTEND_URL
          )

          missing=0
          for item in "${required_vars[@]}"; do
            if [ -z "${!item}" ]; then
              echo "Missing variable: $item"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Set required Azure repository variables and secrets before deploy."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)
          echo "login-server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push API image
        id: api-image
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login-server }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ACR_LOGIN_SERVER/lattice-policy-api:$IMAGE_TAG"
          docker build -f server/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: frontend-image
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login-server }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ACR_LOGIN_SERVER/lattice-policy-ui:$IMAGE_TAG"
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_CARRIER_TENANT_ID="$VITE_CARRIER_TENANT_ID" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Run migration job
        run: |
          execution_name=$(az containerapp job start \
            --name "$AZURE_CONTAINER_APP_MIGRATION_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name --output tsv)
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name "$execution_name" \
              --job-name "$AZURE_CONTAINER_APP_MIGRATION_JOB" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.status --output tsv)
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          echo "Migration job timed out"
          exit 1

      - name: Deploy API container app
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_API" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.api-image.outputs.image }}"

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_FRONTEND" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.frontend-image.outputs.image }}"

      - name: Smoke test API health
        run: |
          body=$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$TEST_API_HEALTH_URL")
          echo "$body" | grep -q '"status":"ok"'

      - name: Smoke test frontend
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-all-errors "$TEST_FRONTEND_URL"

  post-deploy-e2e:
    name: Post-deploy Playwright
    needs: deploy
    uses: ./.github/workflows/e2e-post-deploy.yml
    secrets: inherit
