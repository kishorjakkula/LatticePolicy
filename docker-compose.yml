services:
  db:
    image: postgres:15
    container_name: policy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lattice_policy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-lattice_policy}
    ports:
      - "65432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lattice_policy} -d ${DB_NAME:-lattice_policy}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m

  cache:
    image: redis:7-alpine
    container_name: policy-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 128m

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: policy-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-lattice_policy}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-lattice_policy}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CUSTOMER_DATA_KEY: ${CUSTOMER_DATA_KEY:-customer-data-key-for-local-docker-e2e}
      MFA_TOKEN_SECRET: ${MFA_TOKEN_SECRET:-mfa-token-secret-for-local-docker-e2e}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: 3000
      REDIS_URL: redis://cache:6379
      CACHE_ENABLED: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3300:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3300}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: policy-ui
    restart: unless-stopped
    environment:
      VITE_USE_MOCK: "0"
    ports:
      - "5173:80"
    depends_on:
      - server
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
  redisdata:
