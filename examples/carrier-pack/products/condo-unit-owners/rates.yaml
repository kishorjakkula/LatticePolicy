product: condo-unit-owners
version: 1.0.0
# The whole rating algorithm for this product. Each selected coverage is
# priced by its own method, then multiplied by every factor below and by its
# deductible factor.
rating:
  basePremium: 180
  termFactors:
    6: 0.55
    12: 1
  factors:
    - name: Construction
      field: construction
      table:
        frame: 1.05
        masonry: 0.90
        other: 1.10
      default: 1
    - name: Protection class
      field: protectionClass
      ranges:
        '1-4': 0.92
        '5-8': 1.00
        '9-10': 1.20
      default: 1
    - name: Roof age
      field: roofAgeYears
      ranges:
        '0-10': 1.00
        '11-20': 1.03
        '21+': 1.08
      default: 1
    # Factor read from a carrier lookup table (tables/roof-types.yaml).
    - name: Roof type
      field: roofType
      fromTable: roof-types
      value: factor
      default: 1
    - name: Floor level
      field: floorLevel
      ranges:
        '1-3': 1.00
        '4-10': 0.97
        '11+': 0.95
      default: 1
    - name: Occupancy
      field: occupancy
      table:
        OwnerOccupied: 1.00
        TenantOccupied: 1.15
        Seasonal: 1.25
      default: 1
    - name: State
      path: state
      table:
        TX: 1.10
        FL: 1.35
      default: 1
  coverages:
    A:
      rate: 1.35
      ratePer: 1000
      deductibleFactors:
        500: 1.10
        1000: 1.00
        2500: 0.90
        5000: 0.82
    C:
      rate: 0.90
      ratePer: 1000
    D:
      rate: 0.25
      ratePer: 1000
    E:
      byLimit:
        100000: 40
        300000: 55
        500000: 68
        1000000: 95
    F:
      byLimit:
        1000: 8
        5000: 15
      applyFactors: false
    LOSS_ASSESS:
      byLimit:
        1000: 6
        10000: 22
        25000: 38
        50000: 60
      applyFactors: false
    # One premium per scheduled item: 1.20 per 100 of insured value, by category.
    SCHEDULED:
      perItem:
        list: scheduledItems
        amount: value
        rate: 1.20
        ratePer: 100
        factors:
          - name: Category
            field: category
            table:
              jewelry: 1.50
              art: 1.20
              electronics: 1.00
            default: 1
      applyFactors: false
  minimumPremium: 150
fees:
  policy: 25.00
taxes:
  rate: 0.02
